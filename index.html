<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>User Management System </title>
</head>
<body class="bg-black text-gray-200 p-8">

    <div class="max-w-6xl mx-auto bg-[#121212] shadow-2xl border border-gray-800 rounded-xl overflow-hidden">
        
        <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-[#1a1a1a]">
            <div>
                <h1 class="text-2xl font-bold text-white">Users</h1>
                <p class="text-gray-500 text-sm">Manage your team members and their account details.</p>
            </div>
            <button class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-lg text-sm font-bold transition">
                + Add New User
            </button>
        </div>

        <div class="p-4 bg-[#161616] border-b border-gray-800 flex flex-wrap gap-6 items-center">
            <div class="flex items-center gap-3">
                <label for="search" class="text-sm font-medium text-gray-400">Search:</label>
                <input type="text" id="search" placeholder="Search by name or email" 
                    class="bg-[#222] border border-gray-700 text-white rounded-md px-4 py-2 text-sm w-72 focus:border-indigo-500 outline-none transition">
            </div>

            <div class="flex items-center gap-3">
                <label for="select" class="text-sm font-medium text-gray-400">Filter by Specialty:</label>
                <select id="select" 
                    class="bg-[#222] border border-gray-700 text-white rounded-md px-4 py-2 text-sm outline-none focus:border-indigo-500 transition cursor-pointer">
                    <option value="all">All</option>
                    <option value="Backend">Backend</option>
                    <option value="Frontend">Frontend</option>
                    <option value="Fullstack">Fullstack</option>
                </select>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-[#1a1a1a] text-gray-400 text-xs uppercase tracking-wider">
                        <th class="px-6 py-4 font-semibold border-b border-gray-800">Name</th>
                        <th class="px-6 py-4 font-semibold border-b border-gray-800">Email</th>
                        <th class="px-6 py-4 font-semibold border-b border-gray-800">Age</th>
                        <th class="px-6 py-4 font-semibold border-b border-gray-800">Specialty</th>
                        <th class="px-6 py-4 font-semibold border-b border-gray-800 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody" class="divide-y divide-gray-800">
                    <tr class="hover:bg-[#1e1e1e] transition duration-200">
                        <td class="px-6 py-4 font-medium text-gray-200">John Doe</td>
                        <td class="px-6 py-4 text-sm text-gray-400">john@example.com</td>
                        <td class="px-6 py-4 text-sm text-gray-400">24</td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 bg-gray-800 text-gray-300 rounded-md text-xs border border-gray-700">Frontend</span>
                        </td>
                        <td class="px-6 py-4 text-right">
                            <button class="text-emerald-400 hover:text-emerald-300 mr-4 font-medium text-sm transition">Edit</button>
                            <button class="text-rose-500 hover:text-rose-400 font-medium text-sm transition">Delete</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
